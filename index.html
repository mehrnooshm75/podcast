<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women in Science Podcast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            background: #0f0c20;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* پس‌زمینه رنگی و مات (Glow background) */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* عکس پروفایل با هاله نئونی بنفش/صورتی */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
        }

        /* عنوان پادکست */
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        /* کانتینر دکمه‌ها */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* استایل دکمه‌ها به سبک شیشه‌ای (Glassmorphism) */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* انیمیشن هوور (موس روی دکمه) */
        .link-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
        }

        .footer {
            margin-top: 40px;
            opacity: 0.4;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تصویر لوگو / پروفایل پادکست -->
        <div class="avatar-wrapper">
            <img class="avatar" src="YOUR_IMAGE_URL_HERE" alt="Women in Science Podcast">
        </div>

        <!-- اسم پادکست -->
        <h1>women_in_science_podcast</h1>

        <!-- لیست دکمه‌ها -->
        <div class="links-wrapper">
            <a href="YOUR_CASTBOX_LINK" target="_blank" class="link-card">Castbox</a>
            <a href="YOUR_SPOTIFY_LINK" target="_blank" class="link-card">Spotify</a>
            <a href="YOUR_APPLE_PODCASTS_LINK" target="_blank" class="link-card">Apple Podcasts</a>
            <a href="YOUR_INSTAGRAM_LINK" target="_blank" class="link-card">Instagram</a>
            <a href="YOUR_TELEGRAM_LINK" target="_blank" class="link-card">Telegram</a>
        </div>

        <div class="footer">
            Women in Science
        </div>
    </div>

</body>
</html>
